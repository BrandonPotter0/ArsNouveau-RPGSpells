modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},21.2)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ars_nouveau"
type="required"
versionRange="[5.13.5,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="spell_engine"
type="required"
versionRange="[1.10.9,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="wizards"
type="optional"
versionRange="*"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="elemental_wizards_rpg"
type="optional"
versionRange="*"
ordering="AFTER"
side="BOTH"
